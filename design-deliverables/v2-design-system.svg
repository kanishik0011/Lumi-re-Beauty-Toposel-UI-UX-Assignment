  <text x="72" y="405" class="k">Typography</text><text x="72" y="462" class="h" style="font-size:58px">Your glow. Your ritual.</text><text x="76" y="500" class="b">Cormorant Garamond · display / headings</text><text x="72" y="560" style="font:600 24px Arial;fill:#25231f">Thoughtfully curated beauty essentials.</text><text x="74" y="590" class="b">Manrope · body / UI / product metadata</text>
